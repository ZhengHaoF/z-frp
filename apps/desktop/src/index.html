<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>z-frp 客户端</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">z</span>
        <div class="brand-text">
          <strong>z-frp</strong>
          <span class="muted" id="versionText">v0.2.0</span>
        </div>
      </div>
      <div class="status-pill" id="statusPill" data-state="offline">
        <span class="dot"></span>
        <span id="statusText">未连接</span>
      </div>
    </header>

    <section class="card global-settings">
      <div class="global-row">
        <div class="server-field">
          <label for="serverInput">服务端地址</label>
          <input id="serverInput" list="serverPresets" spellcheck="false" placeholder="wss://frp.example.com/_frp" />
          <datalist id="serverPresets">
            <option value="wss://frp.infocloud.top/_frp"></option>
            <option value="ws://127.0.0.1:17000/_frp"></option>
          </datalist>
        </div>
        <label class="check"><input type="checkbox" id="remember" checked /><span>记住设置与 Key</span></label>
        <label class="check"><input type="checkbox" id="autoConnect" /><span>启动后自动连接</span></label>
      </div>
    </section>

    <main class="tunnel-area">
      <div class="section-head">
        <h2>隧道 <span class="muted" id="tunnelCount"></span></h2>
        <button class="icon-btn" id="addTunnel">+ 添加隧道</button>
      </div>
      <div class="tunnel-list" id="tunnelList"></div>
    </main>

    <section class="card logs">
      <div class="logs-head">
        <h2>运行日志 <span class="tray-hint">· 关闭窗口后继续在后台运行，可从托盘恢复</span></h2>
        <div class="logs-actions">
          <label class="check small"><input type="checkbox" id="autoScroll" checked /><span>自动滚动</span></label>
          <button class="icon-btn" id="copyLogs">复制</button>
          <button class="icon-btn" id="clearLogs">清空</button>
        </div>
      </div>
      <div class="log-body" id="logBody"></div>
    </section>

    <div class="toast" id="toast"></div>
    <script src="main.js"></script>
  </body>
</html>
